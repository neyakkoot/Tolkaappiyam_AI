<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>தொல்காப்பிய AI கற்பித்தல் கருவி</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f4f9; padding: 20px; text-align: center; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        input { width: 80%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 5px; font-size: 18px; }
        button { background-color: #2c3e50; color: white; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        #result { margin-top: 20px; text-align: left; padding: 15px; border-radius: 8px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .rule-box { font-style: italic; color: #555; margin-top: 10px; border-top: 1px solid #ccc; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>தொல்காப்பிய செநு கற்பித்தல் கருவி</h2>
        <p>AI-Driven Pedagogical Tool for Tholkappiyam</p>
        <input type="text" id="wordInput" placeholder="சொல்லை உள்ளிடவும் (எ.கா: நன்ரி, வுட்கை)...">
        <br>
        <button onclick="checkGrammar()">சரிபார்க்க</button>

        <div id="result"></div>
    </div>

    <script src="logic.js"></script>
</body>
</html>
